services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: peerfora
      POSTGRES_USER: peerfora
      POSTGRES_PASSWORD: peerfora
    ports:
      - "5432:5432"
    volumes:
      - peerfora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peerfora -d peerfora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  peerfora-postgres-data:
