name: Peerfora
options:
  bundleIdPrefix: com.peerfora
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Peerfora:
    type: application
    platform: iOS
    sources:
      - path: Peerfora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peerfora.student
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Peerfora
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      properties:
        PEERFORA_API_BASE_URL: http://127.0.0.1:3000
        CFBundleURLTypes:
          - CFBundleURLName: com.peerfora.student
            CFBundleURLSchemes:
              - peerfora
    dependencies:
      - target: PeerforaWidgets
        embed: true
  PeerforaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PeerforaWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peerfora.student.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SKIP_INSTALL: YES
