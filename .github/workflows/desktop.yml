name: Desktop builds

on:
  push:
    paths:
      - "apps/desktop/**"
      - "apps/admin-desktop/**"
      - "packages/design-tokens/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/admin-desktop/**"
      - "packages/design-tokens/**"
      - ".github/workflows/desktop.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        app: [desktop, admin-desktop]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install trunk --locked
      - run: cargo install tauri-cli --locked
      - if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev
          build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev
          libayatana-appindicator3-dev
      - shell: bash
        run: cargo tauri build
        working-directory: apps/${{ matrix.app }}/src-tauri

  windows-widget:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build widgets/windows/Peerfora.WidgetProvider/Peerfora.WidgetProvider.csproj
