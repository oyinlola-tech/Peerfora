name: API build

on:
  push:
    paths:
      - "src/**"
      - "migrations/**"
      - "data/**"
      - "templates/**"
      - "packages/design-tokens/**"
      - "infrastructure/docker/**"
      - "tests/**"
      - "apps/**"
      - "widgets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "src/**"
      - "migrations/**"
      - "data/**"
      - "templates/**"
      - "packages/design-tokens/**"
      - "infrastructure/docker/**"
      - "tests/**"
      - "apps/**"
      - "widgets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - ".github/workflows/api.yml"

jobs:
  migrations:
    name: Migrations and schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: peerfora
          POSTGRES_PASSWORD: peerfora
          POSTGRES_DB: peerfora_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peerfora -d peerfora_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PEERFORA_MIGRATION_DATABASE_URL: postgresql://peerfora:peerfora@localhost:5432/peerfora_migrations
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and assert schema
        run: bash scripts/check_migrations.sh

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: peerfora
          POSTGRES_PASSWORD: peerfora
          POSTGRES_DB: peerfora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peerfora -d peerfora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PEERFORA_TEST_DATABASE_URL: postgresql://peerfora:peerfora@localhost:5432/peerfora_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check_source_file_line_limits.sh
      - name: cargo fmt
        run: |
          set -o pipefail
          printf '::error::rustc::%s\n' "$(rustc --version)"
          printf '::error::rustfmt::%s\n' "$(rustfmt --version)"
          cargo fmt --all -- --check 2>&1 | tee /tmp/cargo-fmt.log
      - name: show fmt diff
        if: always()
        run: |
          printf '::error::checkout::HEAD=%s\n' "$(git rev-parse HEAD)"
          printf '::error::checkout::blob=%s\n' "$(git rev-parse HEAD:tests/admin_auth_postgres/administrator_mfa_reset.rs 2>/dev/null || echo missing)"
          printf '::error::checkout::sig=%s\n' "$(sed -n '52p' tests/admin_auth_postgres/administrator_mfa_reset.rs 2>/dev/null || echo missing)"
          if [ -s /tmp/cargo-fmt.log ]; then
            while IFS= read -r line; do
              printf '::error::fmt::%s\n' "$line"
            done < /tmp/cargo-fmt.log
          fi
      - name: cargo check
        run: |
          set -o pipefail
          cargo check --locked --all-targets > /tmp/cargo-check.log 2>&1
      - name: show check log
        if: always()
        run: |
          if [ -s /tmp/cargo-check.log ]; then
            grep -nE "error\[|--> |expected |cannot find|cannot resolve|note:" /tmp/cargo-check.log | tail -n 25 | while IFS= read -r line; do
              printf '::error::check::%s\n' "$line"
            done
          fi
      - name: cargo clippy
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee /tmp/cargo-clippy.log
      - name: cargo test
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast -- --test-threads=1 2>&1 | tee /tmp/cargo-test.log
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/cargo-*.log
          if-no-files-found: ignore
