name: API build

on:
  push:
    paths:
      - "src/**"
      - "migrations/**"
      - "data/**"
      - "templates/**"
      - "packages/design-tokens/**"
      - "infrastructure/docker/**"
      - "tests/**"
      - "apps/**"
      - "widgets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "src/**"
      - "migrations/**"
      - "data/**"
      - "templates/**"
      - "packages/design-tokens/**"
      - "infrastructure/docker/**"
      - "tests/**"
      - "apps/**"
      - "widgets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - ".github/workflows/api.yml"

jobs:
  migrations:
    name: Migrations and schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: peerfora
          POSTGRES_PASSWORD: peerfora
          POSTGRES_DB: peerfora_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peerfora -d peerfora_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PEERFORA_MIGRATION_DATABASE_URL: postgresql://peerfora:peerfora@localhost:5432/peerfora_migrations
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and assert schema
        run: bash scripts/check_migrations.sh

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: peerfora
          POSTGRES_PASSWORD: peerfora
          POSTGRES_DB: peerfora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peerfora -d peerfora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PEERFORA_TEST_DATABASE_URL: postgresql://peerfora:peerfora@localhost:5432/peerfora_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check_source_file_line_limits.sh
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast -- --test-threads=1
